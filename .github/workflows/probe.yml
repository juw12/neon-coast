name: probe

# Not for main: measurements on GitHub's computers. Runs only for branches named probe/.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: city with the Paper Round beam 44.8 m from a ramp, 2.0.1
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            corner: "ramp"
            run: python test/city.py;python test/city.py;python test/city.py
          - name: city with the Paper Round beam 44.8 m from a ramp, 2.0
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            corner: "ramp"
            run: cp v20.html NeonCoast.html;python test/city.py;python test/city.py;python test/city.py
          - name: city three times, 2.0.1 (a)
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            corner: ""
            run: python test/city.py;python test/city.py;python test/city.py
          - name: city three times, 2.0.1 (b)
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            corner: ""
            run: python test/city.py;python test/city.py;python test/city.py
          - name: city three times, 2.0.1 (c)
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            corner: ""
            run: python test/city.py;python test/city.py;python test/city.py
          - name: city three times, 2.0
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            corner: ""
            run: cp v20.html NeonCoast.html;python test/city.py;python test/city.py;python test/city.py
          - name: pace three times, 2.0.1
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            corner: ""
            run: python test/pace.py;python test/pace.py;python test/pace.py
    env:
      PYTHONUTF8: "1"
      NEON_CHROME_ARGS: ${{ matrix.args }}
      NEON_WINDOW: ${{ matrix.window }}
      NEON_FOOT_CORNER: ${{ matrix.corner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet playwright
      - run: python -m playwright install webkit
      - name: The builds of 1.9 and 2.0, from their tags
        shell: bash
        run: |
          git show v1.9.0:NeonCoast.html > v19.html
          git show v2.0.0:NeonCoast.html > v20.html
      - name: ${{ matrix.name }}
        shell: bash
        run: |
          set +e
          IFS=';' read -ra COMMANDS <<< "${{ matrix.run }}"
          for command in "${COMMANDS[@]}"; do
            echo "=== $command"
            $command
            echo "exit code of [$command]: $?"
          done
          exit 0
