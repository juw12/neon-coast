name: probe

# Not for main: measurements on GitHub's computers. Runs only for branches named probe/.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: where the crashes are, three stars
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            run: python test/chase_bench.py NeonCoast.html 3 21 6;python test/chase_bench.py v19.html 3 21 6;python test/chase_bench.py v20.html 3 21 6
          - name: the same street with no police
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            run: python test/chase_bench.py NeonCoast.html 0 21 4;python test/chase_bench.py v19.html 0 21 4;python test/chase_bench.py v20.html 0 21 4
          - name: where the crashes are, two stars
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            run: python test/chase_bench.py NeonCoast.html 2 21 6;python test/chase_bench.py v19.html 2 21 6;python test/chase_bench.py v20.html 2 21 6
    env:
      PYTHONUTF8: "1"
      NEON_CHROME_ARGS: ${{ matrix.args }}
      NEON_WINDOW: ${{ matrix.window }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet playwright
      - run: python -m playwright install webkit
      - name: The builds of 1.9 and 2.0, from their tags
        shell: bash
        run: |
          git show v1.9.0:NeonCoast.html > v19.html
          git show v2.0.0:NeonCoast.html > v20.html
      - name: ${{ matrix.name }}
        shell: bash
        run: |
          set +e
          IFS=';' read -ra COMMANDS <<< "${{ matrix.run }}"
          for command in "${COMMANDS[@]}"; do
            echo "=== $command"
            $command
            echo "exit code of [$command]: $?"
          done
          exit 0
