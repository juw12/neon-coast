name: probe

# Not for main: measurements on GitHub's computers. Runs only for branches named probe/.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: three stars, 2.0.1 then 1.9
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            run: python test/chase_bench.py NeonCoast.html 3 21 8;python test/chase_bench.py v19.html 3 21 8
          - name: three stars, 1.9 then 2.0.1
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            run: python test/chase_bench.py v19.html 3 21 8;python test/chase_bench.py NeonCoast.html 3 21 8
          - name: three stars 2.0, two stars 2.0.1 and 1.9
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            run: python test/chase_bench.py v20.html 3 21 8;python test/chase_bench.py NeonCoast.html 2 21 6;python test/chase_bench.py v19.html 2 21 6
          - name: the old way, to see the patrol cars
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            run: python test/chase_bench.py NeonCoast.html 3 21 5 old;python test/chase_bench.py v19.html 3 21 5 old
    env:
      PYTHONUTF8: "1"
      NEON_CHROME_ARGS: ${{ matrix.args }}
      NEON_WINDOW: ${{ matrix.window }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet playwright
      - run: python -m playwright install webkit
      - name: The builds of 1.9 and 2.0, from their tags
        shell: bash
        run: |
          git show v1.9.0:NeonCoast.html > v19.html
          git show v2.0.0:NeonCoast.html > v20.html
      - name: ${{ matrix.name }}
        shell: bash
        run: |
          set +e
          IFS=';' read -ra COMMANDS <<< "${{ matrix.run }}"
          for command in "${COMMANDS[@]}"; do
            echo "=== $command"
            $command
            echo "exit code of [$command]: $?"
          done
          exit 0
