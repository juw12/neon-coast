name: probe

# Not for main: a look at which GitHub computer draws the game fastest. Runs only for branches named probe/.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet playwright
      - name: The builds of 1.9 and 2.0, from their tags
        shell: bash
        run: |
          git show v1.9.0:NeonCoast.html > v19.html
          git show v2.0.0:NeonCoast.html > v20.html
          cp NeonCoast.html steps.html
      - name: Probe
        run: python test/probe.py steps.html v20.html v19.html
