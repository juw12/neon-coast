name: probe

# Not for main: measurements on GitHub's computers. Runs only for branches named probe/.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bare
            args: ""
            window: ""
            run: python test/touch.py;python test/smoke.py;python test/smoke.py;python test/gates.py
          - name: novsync
            args: "--disable-gpu-vsync"
            window: ""
            run: python test/touch.py;python test/smoke.py;python test/smoke.py;python test/gates.py
          - name: nolimit
            args: "--disable-frame-rate-limit"
            window: ""
            run: python test/touch.py;python test/smoke.py;python test/smoke.py;python test/gates.py
          - name: both
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            run: python test/touch.py;python test/smoke.py;python test/smoke.py;python test/gates.py
          - name: window
            args: ""
            window: "1"
            run: python test/touch.py;python test/smoke.py;python test/smoke.py;python test/gates.py
          - name: window both
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: "1"
            run: python test/touch.py;python test/smoke.py;python test/smoke.py;python test/gates.py
          - name: pace both
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            window: ""
            run: python test/pace.py;python test/pace.py;python test/pace.py v20.html
          - name: pace window
            args: ""
            window: "1"
            run: python test/pace.py;python test/pace.py;python test/pace.py v20.html
    env:
      PYTHONUTF8: "1"
      NEON_CHROME_ARGS: ${{ matrix.args }}
      NEON_WINDOW: ${{ matrix.window }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet playwright
      - run: python -m playwright install webkit
      - name: The builds of 1.9 and 2.0, from their tags
        shell: bash
        run: |
          git show v1.9.0:NeonCoast.html > v19.html
          git show v2.0.0:NeonCoast.html > v20.html
      - name: ${{ matrix.name }}
        shell: bash
        run: |
          set +e
          IFS=';' read -ra COMMANDS <<< "${{ matrix.run }}"
          for command in "${COMMANDS[@]}"; do
            echo "=== $command"
            $command
            echo "exit code of [$command]: $?"
          done
          exit 0
