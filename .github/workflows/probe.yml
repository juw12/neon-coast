name: probe

# Not for main: measurements on GitHub's computers. Runs only for branches named probe/.
# This one is the judge kit: the screenshots and result files the council reads, and the jobs played with
# key presses only (test/drive.py), for the NeonCoast.html of this commit.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kit, screenshots and results
            id: kit
            args: ""
            run: python test/smoke.py;python test/gates.py;python test/city_shots.py;python test/havoc_shots.py;python test/radio.py;python test/touch.py
          - name: drive job 1, three runs
            id: drive1
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            run: python test/drive.py 3
          - name: drive job 2, two runs
            id: drive2
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            run: python test/drive.py 2 2
          - name: drive job 3, two runs
            id: drive3
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            run: python test/drive.py 2 3
          - name: drive job 4, two runs
            id: drive4
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            run: python test/drive.py 2 4
          - name: drive job 5, three runs
            id: drive5
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            run: python test/drive.py 3 5
          - name: drive job 5, three more runs
            id: drive5b
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            run: python test/drive.py 3 5
          - name: drive job 5, another three runs
            id: drive5c
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            run: python test/drive.py 3 5
          - name: 2.1 with this script, job 5, three runs
            id: base5
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            html: v2.1.0
            run: env NEON_HTML=base.html python test/drive.py 3 5
          - name: 2.1 with this script, job 5, three more runs
            id: base5b
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            html: v2.1.0
            run: env NEON_HTML=base.html python test/drive.py 3 5
          - name: 2.1 with this script, job 5, another three runs
            id: base5c
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            html: v2.1.0
            run: env NEON_HTML=base.html python test/drive.py 3 5
          - name: drive job 6, two runs
            id: drive6
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            run: python test/drive.py 2 6
          - name: drive Shadow Run, three runs
            id: drivetail
            args: "--disable-gpu-vsync --disable-frame-rate-limit"
            run: python test/drive.py 3 tail
    env:
      PYTHONUTF8: "1"
      NEON_CHROME_ARGS: ${{ matrix.args }}
      NEON_FPS_UNCAPPED: "1"
      # a commit message with "[only: drive5 drive5b ]" (ids with a space on both sides) runs just those jobs
      HEAD_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet playwright
      - if: matrix.html
        run: curl -sSL -o base.html https://github.com/juw12/neon-coast/releases/download/${{ matrix.html }}/NeonCoast.html && ls -l base.html
      - if: matrix.id == 'kit'
        run: python -m playwright install webkit
      - name: ${{ matrix.name }}
        shell: bash
        run: |
          set +e
          mkdir -p logs
          if [[ "$HEAD_MESSAGE" == *"[only:"* && "$HEAD_MESSAGE" != *" ${{ matrix.id }} "* ]]; then
            echo "not asked for in this commit" | tee "logs/${{ matrix.id }}-skipped.txt"
            exit 0
          fi
          IFS=';' read -ra COMMANDS <<< "${{ matrix.run }}"
          index=0
          for command in "${COMMANDS[@]}"; do
            index=$((index + 1))
            echo "=== $command"
            $command 2>&1 | tee "logs/${{ matrix.id }}-$index.txt" | tail -n 60
            echo "exit code of [$command]: ${PIPESTATUS[0]}" | tee -a "logs/${{ matrix.id }}-$index.txt"
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.id }}
          path: |
            test/shots/**
            test/*-result*.json
            logs/**
          if-no-files-found: warn
