name: suites

# Every suite of test/ on a GitHub computer, one job for each suite: for the game of this commit, and for
# the game of the last release under the same checks. A check that fails for the release too is either
# something this commit changed on purpose (test/pace.py is that) or says something about the computer.
#
# They run on GitHub's Macs, the only free GitHub computer with a graphics card. A browser without a window
# draws there at 14 to 28 frames a second under its own frame cap and at 75 to 210 with the cap off
# (NEON_CHROME_ARGS). With the cap off a screenshot now and then waits 30 s for a frame and times out, so
# the three suites that take screenshots (gates, smoke, touch) keep the cap, and the frame-rate gate alone
# is measured in a browser of its own with the cap off (NEON_FPS_UNCAPPED). The other suites run with it off.
# The Windows computers have no graphics card and draw the game at 8 to 13 frames a second: three suites
# that count on the game's own clock run there as well, as "a slow computer", and do not fail the pull request.
# A suite that fails is run again, up to three times, and the summary says on which attempt it passed.

# A pull request that changes only text (README, hone/) does not start the suites: they read no Markdown.
on:
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: NeonCoast.html is the build of src/
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - shell: pwsh
        run: |
          python build.py
          git diff --stat --exit-code -- NeonCoast.html
          if ($LASTEXITCODE -ne 0) { Write-Error "NeonCoast.html is not the build of src/"; exit 1 }

  suite:
    name: ${{ matrix.suite }} (${{ matrix.game }}${{ matrix.os != 'macos-latest' && ', a slow computer' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # the last release and the slow computer are there to compare with: they do not fail the pull request
    continue-on-error: ${{ matrix.game != 'this commit' || matrix.os != 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [pace, havoc, thrill, gates, chase, city, harbor, smoke, radio, touch]
        game: [this commit, v2.0.1]
        os: [macos-latest]
        include:
          - { suite: chase, game: this commit, os: windows-latest }
          - { suite: havoc, game: this commit, os: windows-latest }
          - { suite: thrill, game: this commit, os: windows-latest }
    env:
      PYTHONUTF8: "1"
      SUITE: ${{ matrix.suite }}
      BUILD: ${{ matrix.game }}${{ matrix.os != 'macos-latest' && ', a slow computer' || '' }}
      # the frame cap of a browser without a window: off, except for the suites that take screenshots
      NEON_CHROME_ARGS: ${{ matrix.os == 'macos-latest' && !contains(fromJSON('["gates", "smoke", "touch"]'), matrix.suite) && '--disable-gpu-vsync --disable-frame-rate-limit' || '' }}
      # gate G7 asks for 60 frames a second or more: measured in a browser of its own with the cap off
      NEON_FPS_UNCAPPED: ${{ matrix.os == 'macos-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: The game of the last release, under the checks of this commit
        if: matrix.game != 'this commit'
        shell: bash
        run: |
          git fetch --depth 1 origin "refs/tags/${{ matrix.game }}:refs/tags/${{ matrix.game }}"
          git checkout "${{ matrix.game }}" -- NeonCoast.html index.html sw.js manifest.webmanifest src icons vendor build.py README.md

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Playwright (Chrome is on the runner)
        run: python -m pip install --quiet playwright

      - name: WebKit, for the Safari check
        if: matrix.suite == 'touch'
        run: python -m playwright install webkit

      - name: Run the suite, up to three times
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force logs | Out-Null
          $summary = @("### $env:SUITE, $env:BUILD", "")
          $passedAt = 0
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $log = "logs/$env:SUITE-$attempt.txt"
            "::group::attempt $attempt"
            $started = Get-Date
            python "test/$env:SUITE.py" *>&1 | Tee-Object -FilePath $log
            $code = $LASTEXITCODE
            "::endgroup::"
            $seconds = [int]((Get-Date) - $started).TotalSeconds
            $count = (Select-String -Path $log -Pattern "\d+ ?/ ?\d+ checks|GATES \d+/\d+|TOUCH \d+/\d+|^PASS .*offline" | Select-Object -Last 1).Line
            if (-not $count) {
              $passes = @(Select-String -Path $log -CaseSensitive -Pattern "^PASS").Count
              $fails = @(Select-String -Path $log -CaseSensitive -Pattern "^FAIL").Count
              $count = "$passes PASS, $fails FAIL"
            }
            $summary += "- attempt ${attempt}: exit $code, $seconds s. $count"
            foreach ($line in (Select-String -Path $log -CaseSensitive -Pattern "^FAIL|Error:|^STATE" | Select-Object -First 12)) {
              $text = $line.Line
              if ($text.Length -gt 400) { $text = $text.Substring(0, 400) }
              $summary += "    - $text"
            }
            if ($code -eq 0) { $passedAt = $attempt; break }
          }
          $summary += ""
          $summary += $(if ($passedAt) { "Passed on attempt $passedAt." } else { "Failed three times." })
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary
          if (-not $passedAt) { exit 1 }

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.suite }}-${{ matrix.game == 'this commit' && 'head' || matrix.game }}${{ matrix.os != 'macos-latest' && '-slow' || '' }}
          path: |
            logs/
            test/*-result*.json
          if-no-files-found: ignore
